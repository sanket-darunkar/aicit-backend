# ============================================================
# AICIT – PROD profile
# ALL values MUST come from environment variables.
# Required: AICIT_DB_URL, AICIT_DB_USERNAME, AICIT_DB_PASSWORD,
#           AICIT_JWT_SECRET, AICIT_FRONTEND_URL, AICIT_ADMIN_EMAIL,
#           AICIT_ADMIN_PASSWORD
# ============================================================

spring.datasource.url=${AICIT_DB_URL}
spring.datasource.username=${AICIT_DB_USERNAME}
spring.datasource.password=${AICIT_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.keepalive-time=60000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway – run migrations on startup before Hibernate validates the schema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

logging.level.com.aicit=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.root=WARN

springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

server.tomcat.connection-timeout=20000

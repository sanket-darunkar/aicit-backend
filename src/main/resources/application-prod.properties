# ============================================================
# AICIT – PROD profile
# ALL values MUST come from environment variables.
# Required: AICIT_DB_URL, AICIT_DB_USERNAME, AICIT_DB_PASSWORD,
#           AICIT_JWT_SECRET, AICIT_FRONTEND_URL, AICIT_ADMIN_EMAIL,
#           AICIT_ADMIN_PASSWORD
# ============================================================

spring.datasource.url=${AICIT_DB_URL}
spring.datasource.username=${AICIT_DB_USERNAME}
spring.datasource.password=${AICIT_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.keepalive-time=60000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
# Required for PostgreSQL bytea LAZY fields (pdf_data, photo_data) — prevents
# "Could not create connection to database server" on first LOB access.
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# initialization-fail-timeout: how long Hikari waits for the first connection
# before allowing Spring to finish startup.
#
# -1  = never wait (port opens immediately but first requests race the DB wake-up
#       → "Network Error" on login if the user arrives before the DB is ready)
#  0  = fail startup if no connection (too strict for Render's sleeping Postgres)
# 60000 = wait up to 60 s for Postgres to wake, THEN open the port.
#   • Render's managed Postgres typically wakes in 10–40 s.
#   • The HTTP port opens as soon as the pool gets its first connection.
#   • flyway.connect-retries=10 handles the remaining retry window.
#   • 60 s < Render's ~90 s port-binding timeout, so the service stays live.
spring.datasource.hikari.initialization-fail-timeout=60000

# Flyway – run migrations on startup before Hibernate validates the schema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.connect-retries=10

logging.level.com.aicit=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.root=WARN

springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

server.tomcat.connection-timeout=20000

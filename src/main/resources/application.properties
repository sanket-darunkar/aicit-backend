# ============================================================
# AICIT Platform – Base Configuration
# Active profile driven by SPRING_PROFILES_ACTIVE env var
# Default: dev
# ============================================================

spring.application.name=aicit-platform
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server – port 8081 to avoid conflict with MCA backend on 8080
server.port=${PORT:${SERVER_PORT:8081}}
server.servlet.context-path=/

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT – NO default secret; app refuses to start if not set
app.jwt.secret=${AICIT_JWT_SECRET}
app.jwt.expiration-ms=${AICIT_JWT_EXPIRATION_MS:86400000}

# CORS – whitelist frontend URL only
app.cors.allowed-origins=${AICIT_FRONTEND_URL:http://localhost:5174}

# Seed admin (dev only)
app.seed.admin.email=${AICIT_ADMIN_EMAIL:admin@aicit.local}
app.seed.admin.password=${AICIT_ADMIN_PASSWORD}

# File upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
app.api.base-url=${AICIT_API_BASE_URL:http://localhost:8081}

# ============================================================
# Mail
# ============================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply@aicit.org}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:noreply@aicit.org}
app.frontend.url=${AICIT_FRONTEND_URL:http://localhost:5174}

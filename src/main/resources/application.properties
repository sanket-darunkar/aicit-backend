# ============================================================
# AICIT Platform – Base Configuration
# Active profile driven by SPRING_PROFILES_ACTIVE env var
# Default: dev
# ============================================================

spring.application.name=aicit-platform
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server – port 8081 to avoid conflict with MCA backend on 8080
server.port=${PORT:${SERVER_PORT:8081}}
server.servlet.context-path=/

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT – NO default secret; app refuses to start if not set
app.jwt.secret=${AICIT_JWT_SECRET}
app.jwt.expiration-ms=${AICIT_JWT_EXPIRATION_MS:86400000}

# CORS – whitelist frontend URL only
app.cors.allowed-origins=${AICIT_FRONTEND_URL:http://localhost:5174}

# Seed admin (dev only)
app.seed.admin.email=${AICIT_ADMIN_EMAIL:admin@aicit.local}
app.seed.admin.password=${AICIT_ADMIN_PASSWORD}

# File upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
app.api.base-url=${AICIT_API_BASE_URL:http://localhost:8081}

# ============================================================
# Mail (Hostinger SMTP by default)
# ------------------------------------------------------------
# Hostinger:
#   host = smtp.hostinger.com
#   port = 465 (SSL/TLS)  — set MAIL_SSL=true, MAIL_STARTTLS=false
#   port = 587 (STARTTLS) — set MAIL_SSL=false, MAIL_STARTTLS=true
#   username = full mailbox address, e.g. info@aicit.org.in
#   password = mailbox password
# NOTE: outbound SMTP (465/587) must be allowed by the host.
#       Hosts like Render block these ports — use Brevo there instead.
# ============================================================
spring.mail.host=${MAIL_HOST:smtp.hostinger.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:info@aicit.org.in}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
# SSL (port 465) vs STARTTLS (port 587) — toggle via env
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.hostinger.com}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:info@aicit.org.in}
app.mail.from-name=${MAIL_FROM_NAME:AICIT}

# Brevo HTTP API — used when BREVO_API_KEY is set (required on Render, SMTP is blocked)
brevo.api-key=${BREVO_API_KEY:}
app.frontend.url=${AICIT_FRONTEND_URL:http://localhost:5174}

# ============================================================
# AICIT – DEV profile
# Uses local PostgreSQL. Set env vars or override here locally.
# NEVER commit real passwords.
# ============================================================

spring.datasource.url=${AICIT_DB_URL:jdbc:postgresql://localhost:5432/aicit_dev}
spring.datasource.username=${AICIT_DB_USERNAME:postgres}
spring.datasource.password=${AICIT_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
# Force byte[] to map to bytea (not oid) in PostgreSQL
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

logging.level.com.aicit=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

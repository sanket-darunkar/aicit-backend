# ============================================================
# AICIT – TEST profile (H2 in-memory)
# ============================================================
spring.datasource.url=jdbc:h2:mem:aicit_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

app.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLW9ubHktMzI=
app.jwt.expiration-ms=3600000
app.cors.allowed-origins=http://localhost:5174
app.seed.admin.email=admin@test.local
app.seed.admin.password=TestPass123!

# Effectively disable rate limiting during tests (1000 logins per window)
app.rate-limit.login.capacity=1000
app.rate-limit.login.refill-minutes=5
app.mail.enabled=false
app.seed.admin.email=admin@test.local
app.seed.admin.password=TestPass123!
